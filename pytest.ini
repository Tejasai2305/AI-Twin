[pytest]
# Discovery is restricted to backend/tests - the real, assertion-based
# suite. The repo also has ad-hoc manual debug scripts under tests/
# and backend/services/test_memory.py (module-level side-effecting
# code, no assertions, predates this suite) - letting pytest wander
# into those would execute real API calls and DB writes as a side
# effect of collection. Left in place rather than deleted, since
# removing files outside an explicit request isn't this suite's job.
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
